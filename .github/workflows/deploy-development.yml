name: Deploy Development

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: web-app-development
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: 22022
      SSH_DEPLOYMENT_PATH: ${{ vars.SSH_DEPLOYMENT_PATH }}
      RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Validate SSH configuration
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_DEPLOYMENT_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is not configured for the development environment"
              missing=1
            fi
          done
          exit "$missing"
      - name: Configure SSH
        run: |
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"
      - name: Upload and activate development release
        run: |
          archive="/tmp/web-app-${RELEASE_SHA}.tar.gz"
          tar --exclude=.git -czf "$archive" .
          scp -P "$SSH_PORT" "$archive" "$SSH_USER@$SSH_HOST:/tmp/"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "SSH_DEPLOYMENT_PATH='$SSH_DEPLOYMENT_PATH' RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -eu
          root="$SSH_DEPLOYMENT_PATH/webapp-core/environments/development"
          release="$root/releases/$RELEASE_SHA"
          mkdir -p "$release"
          tar -xzf "/tmp/web-app-$RELEASE_SHA.tar.gz" -C "$release"
          rm -f "/tmp/web-app-$RELEASE_SHA.tar.gz"
          DEPLOY_ENV=development sh "$release/deploy/deploy.sh"
          ln -sfn "$release" "$root/current"
          find "$root/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | tail -n +4 | cut -d' ' -f2- | xargs -r rm -rf
          REMOTE
      - name: Publish VPS deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          description="webapp-core VPS deployment failed"
          if [ "$DEPLOY_STATE" = success ]; then
            description="webapp-core VPS deployment is healthy"
          fi
          payload="$(jq -nc \
            --arg state "$DEPLOY_STATE" \
            --arg context "deploy/vps-webapp-development" \
            --arg description "$description" \
            --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data "$payload"
