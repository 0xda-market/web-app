name: Deploy

on:
  pull_request:
    branches:
      - master
    types:
      - closed
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to deploy
        required: true
        default: master
        type: string
      environment:
        description: GitHub and VPS environment
        required: true
        default: development
        type: choice
        options:
          - development

permissions:
  contents: read
  statuses: write

concurrency:
  group: webapp-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'development' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'development' }}
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'development' }}
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.pull_request.merge_commit_sha }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: 22022
      SSH_DEPLOYMENT_PATH: ${{ vars.SSH_DEPLOYMENT_PATH }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Resolve immutable release
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >>"$GITHUB_ENV"

      - name: Validate deployment configuration
        run: |
          set -eu
          test "$DEPLOY_ENV" = development
          test -n "$RELEASE_REF"
          test -n "$RELEASE_SHA"
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_DEPLOYMENT_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is not configured for the ${DEPLOY_ENV} environment"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure SSH
        run: |
          set -eu
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Upload and activate release
        run: |
          set -eu
          archive="/tmp/web-app-${DEPLOY_ENV}-${RELEASE_SHA}.tar.gz"
          tar --exclude=.git -czf "$archive" .
          scp -P "$SSH_PORT" "$archive" "$SSH_USER@$SSH_HOST:/tmp/"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "SSH_DEPLOYMENT_PATH='$SSH_DEPLOYMENT_PATH' DEPLOY_ENV='$DEPLOY_ENV' RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -eu
          root="$SSH_DEPLOYMENT_PATH/webapp-core/environments/$DEPLOY_ENV"
          release="$root/releases/$RELEASE_SHA"
          mkdir -p "$release"
          tar -xzf "/tmp/web-app-$DEPLOY_ENV-$RELEASE_SHA.tar.gz" -C "$release"
          rm -f "/tmp/web-app-$DEPLOY_ENV-$RELEASE_SHA.tar.gz"
          DEPLOY_ENV="$DEPLOY_ENV" sh "$release/deploy/deploy.sh"
          ln -sfn "$release" "$root/current"
          find "$root/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | tail -n +4 | cut -d' ' -f2- | xargs -r rm -rf
          REMOTE

      - name: Publish VPS deployment status
        if: always() && env.RELEASE_SHA != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          description="webapp-core ${DEPLOY_ENV} deployment failed"
          if [ "$DEPLOY_STATE" = success ]; then
            description="webapp-core ${DEPLOY_ENV} deployment is healthy"
          fi
          payload="$(jq -nc \
            --arg state "$DEPLOY_STATE" \
            --arg context "deploy/vps-webapp-${DEPLOY_ENV}" \
            --arg description "$description" \
            --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data "$payload"
