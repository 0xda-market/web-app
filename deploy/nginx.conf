server {
  listen 8080;
  server_name _;

  location = /health {
    add_header Content-Type text/plain;
    return 200 'ok\n';
  }

  location / {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
  }
}
