<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0f1115">
    <title>0xda-market</title>
    <link rel="stylesheet" href="./src/styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div><p class="eyebrow">0xda-market</p><h1>Market</h1></div>
        <output id="snapshot" class="snapshot">loading</output>
      </header>
      <section class="controls">
        <input id="search" type="search" placeholder="Search" autocomplete="off">
        <select id="category" aria-label="Category"><option value="">All</option></select>
      </section>
      <section id="status" class="status" aria-live="polite">Loading all products…</section>
      <section id="products" class="products" aria-label="Products"></section>
      <nav class="navigation" aria-label="Catalog pages">
        <button id="previous" type="button" aria-label="Previous page">←</button>
        <button id="home" type="button">Categories</button>
        <button id="next" type="button" aria-label="Next page">→</button>
      </nav>
    </main>
    <dialog id="checkout-dialog">
      <section class="dialog-card">
        <button id="close-dialog" class="dialog-close" type="button" aria-label="Close">×</button>
        <p id="dialog-category" class="eyebrow"></p>
        <h2 id="dialog-name"></h2>
        <p id="dialog-price" class="dialog-price"></p>
        <p id="dialog-status" class="dialog-status"></p>
        <button id="checkout-action" class="primary-action" type="button">Request quote</button>
      </section>
    </dialog>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
